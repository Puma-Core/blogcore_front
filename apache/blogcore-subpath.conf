# Add these directives to the VirtualHost that serves fhome on port 7070.
# The Vite build must use: VITE_BASE_PATH=/blogcore_front/ npm run build

Alias /blogcore_front/ /var/www/sites/blogcore_front/dist-fhome/

<Directory /var/www/sites/blogcore_front/dist-fhome/>
    Options -Indexes +FollowSymLinks
    AllowOverride FileInfo
    Require all granted
</Directory>

# Same-origin API proxy for the application mounted below /blogcore_front/.
SSLProxyEngine On
ProxyPass        /blogcore_front/api/ https://admin-blog.pumacore.com/api/
ProxyPassReverse /blogcore_front/api/ https://admin-blog.pumacore.com/api/
