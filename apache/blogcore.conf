# Enable once on Debian/Ubuntu:
#   a2enmod rewrite proxy proxy_http ssl
#   a2ensite blogcore
#   systemctl reload apache2
#
# Replace the server name, certificate paths, and DocumentRoot before enabling.
<VirtualHost *:80>
    ServerName blog.example.com
    DocumentRoot /var/www/blogcore/dist

    <Directory /var/www/blogcore/dist>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [L]

    # Same-origin proxy: prevents browser CORS errors when loading BlogCore data.
    SSLProxyEngine On
    ProxyPass        /api/ https://admin-blog.pumacore.com/api/
    ProxyPassReverse /api/ https://admin-blog.pumacore.com/api/
</VirtualHost>
